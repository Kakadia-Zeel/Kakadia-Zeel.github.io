<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.5" stop-color="#fb923c"/>
      <stop offset="1" stop-color="#fb7185"/>
    </linearGradient>
    <radialGradient id="glow1" cx="15%" cy="0%" r="60%">
      <stop offset="0" stop-color="#fb923c" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#fb923c" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="100%" cy="10%" r="55%">
      <stop offset="0" stop-color="#fb7185" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#fb7185" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#05060a"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- monogram badge -->
  <rect x="80" y="90" width="96" height="96" rx="22" fill="none" stroke="url(#accent)" stroke-width="2" opacity="0.6"/>
  <text x="128" y="155" font-family="'JetBrains Mono', monospace" font-size="46" font-weight="700" text-anchor="middle" fill="url(#accent)">ZK</text>

  <!-- availability pill -->
  <rect x="80" y="250" width="378" height="44" rx="22" fill="#0e1018" stroke="#ffffff" stroke-opacity="0.1"/>
  <circle cx="106" cy="272" r="5" fill="#34d399"/>
  <text x="122" y="279" font-family="'JetBrains Mono', monospace" font-size="18" fill="#9aa1b4">Available for opportunities</text>

  <text x="80" y="380" font-family="Inter, sans-serif" font-size="84" font-weight="800" fill="#e8eaf2">Zeel Kakadia</text>
  <text x="80" y="452" font-family="Inter, sans-serif" font-size="44" font-weight="700" fill="url(#accent)">Backend Engineer  →  AI / ML</text>
  <text x="80" y="512" font-family="Inter, sans-serif" font-size="26" fill="#9aa1b4">Java · Spring Boot · Neo4j · Kafka · GenAI · 4+ years</text>

  <text x="80" y="576" font-family="'JetBrains Mono', monospace" font-size="20" fill="#6b7180">zeelkakadia.dev</text>
</svg>
