<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8ec5fc"/>
      <stop offset="0.55" stop-color="#b9a5f5"/>
      <stop offset="1" stop-color="#e0c3ff"/>
    </linearGradient>
    <radialGradient id="glow1" cx="12%" cy="0%" r="55%">
      <stop offset="0" stop-color="#8ec5fc" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#8ec5fc" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="100%" cy="8%" r="55%">
      <stop offset="0" stop-color="#e0c3ff" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#e0c3ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="#0a0b10"/>
  <rect width="1200" height="630" fill="url(#glow1)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- monogram badge -->
  <rect x="80" y="86" width="92" height="92" rx="20" fill="#14161e" stroke="url(#accent)" stroke-width="2"/>
  <text x="126" y="147" font-family="'Space Grotesk','Inter',sans-serif" font-size="42" font-weight="700" text-anchor="middle" fill="url(#accent)">ZK</text>

  <!-- availability pill -->
  <rect x="80" y="228" width="352" height="46" rx="23" fill="#14161e" stroke="#ffffff" stroke-opacity="0.12"/>
  <circle cx="107" cy="251" r="6" fill="#34d399"/>
  <text x="126" y="258" font-family="'Inter',sans-serif" font-size="19" fill="#a2a6b3">Available for opportunities</text>

  <text x="78" y="372" font-family="'Space Grotesk','Inter',sans-serif" font-size="92" font-weight="700" letter-spacing="-3" fill="url(#accent)">Zeel Kakadia</text>
  <text x="80" y="446" font-family="'Space Grotesk','Inter',sans-serif" font-size="38" font-weight="600" fill="#eef0f4">Software Engineer &amp; AI Evaluation</text>
  <text x="80" y="508" font-family="'Inter',sans-serif" font-size="25" fill="#a2a6b3">Java · Spring Boot · LLM Evaluation · Statistics · 4+ years</text>

  <text x="80" y="576" font-family="'Space Grotesk','Inter',monospace" font-size="20" fill="#6b7080">kakadia-zeel.github.io</text>
